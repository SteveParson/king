name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev autoconf automake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl automake autoconf

      - name: Configure
        run: |
          ./autogen.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          ./configure

      - name: Test
        run: make check

      - name: Build standard
        run: |
          make
          cp src/discord2 discord2-${{ matrix.name }}

      - name: Build small
        run: |
          make -C src clean
          make small
          cp src/discord2 discord2-${{ matrix.name }}-small

      - name: Build tiny
        run: |
          make -C src clean
          make tiny
          cp src/discord2 discord2-${{ matrix.name }}-tiny

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: discord2-${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum discord2-* > checksums-sha256.txt

      - name: Compute tag
        id: tag
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=v${COMMIT_DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "**${COMMIT_MSG}**

          Built from commit \`$(git rev-parse --short=7 HEAD)\` on \`main\`.

          | File | Description |
          |------|-------------|
          | \`discord2-linux-x86_64\` | Linux x86_64 — standard build |
          | \`discord2-linux-x86_64-small\` | Linux x86_64 — size-optimized (-Os) |
          | \`discord2-linux-x86_64-tiny\` | Linux x86_64 — smallest (logs stripped) |
          | \`discord2-macos-x86_64\` | macOS Intel — standard build |
          | \`discord2-macos-x86_64-small\` | macOS Intel — size-optimized (-Os) |
          | \`discord2-macos-x86_64-tiny\` | macOS Intel — smallest (logs stripped) |
          | \`discord2-macos-arm64\` | macOS Apple Silicon — standard build |
          | \`discord2-macos-arm64-small\` | macOS Apple Silicon — size-optimized (-Os) |
          | \`discord2-macos-arm64-tiny\` | macOS Apple Silicon — smallest (logs stripped) |
          | Docker | \`ghcr.io/\${{ github.repository }}:${{ steps.tag.outputs.tag }}\` |" \
            artifacts/discord2-* artifacts/checksums-sha256.txt

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute tag and image name
        id: meta
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=v${COMMIT_DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
