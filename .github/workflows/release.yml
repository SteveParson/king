name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache cosmocc
        uses: actions/cache@v4
        with:
          path: .cosmocc
          key: cosmocc-3.9.2

      - name: Build
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-ape
          path: king

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: king-ape
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum king > checksums-sha256.txt

      - name: Compute tag
        id: tag
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=v${COMMIT_DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "**${COMMIT_MSG}**

          Built from commit \`$(git rev-parse --short=7 HEAD)\` on \`main\`.

          | File | Description |
          |------|-------------|
          | \`king\` | Actually Portable Executable — runs on Linux, macOS, Windows, FreeBSD, OpenBSD, NetBSD |" \
            artifacts/king artifacts/checksums-sha256.txt
